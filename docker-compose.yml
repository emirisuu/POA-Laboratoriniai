services:
  postgres:
    image: postgres:17
    container_name: poa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poa
      POSTGRES_PASSWORD: poatest123
      POSTGRES_DB: poa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: